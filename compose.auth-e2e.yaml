services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: auth_e2e
      POSTGRES_PASSWORD: auth_e2e
      POSTGRES_DB: auth_e2e
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_e2e -d auth_e2e"]
      interval: 1s
      timeout: 5s
      retries: 30
