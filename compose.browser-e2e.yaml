services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: browser_e2e
      POSTGRES_PASSWORD: browser_e2e
      POSTGRES_DB: browser_e2e
    ports:
      - "127.0.0.1:${E2E_DATABASE_PORT}:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U browser_e2e -d browser_e2e"]
      interval: 1s
      timeout: 5s
      retries: 30
